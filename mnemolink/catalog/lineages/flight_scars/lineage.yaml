cumulative_narrative: |
  ### Autonomous Edge Flight Scars

  #### Epoch I: Cape Wrath Microburst Stall
  In coastal cliffs, a severe 34-knot downdraft forced a life-or-death realization: an autopilot commanding pitch-up into a decay of dynamic pressure will kill the airframe. Only a counter-intuitive manual nose-down dive toward the ocean swell generated the airspeed required to regain elevator authority. The lesson was physically carved into the fuselage: airspeed is life; never trade altitude when kinetic margin is exhausted.

  > **Causal Evolution**: Surviving aerodynamic stall instilled an unrelenting skepticism of single-loop automated commands.

  #### Epoch II: Dawn Optical Glare Failover
  During a low-angle mountain approach, the rising sun completely saturated front stereo cameras, producing false optical obstacle hallucinations. Conditioned by the earlier Cape Wrath lesson never to accept single-sensor vetoes, the sensor fusion arbiter immediately demoted the optical pipeline and landed safely on active LiDAR and ultrasonic data alone.

  ### Cumulative Autonomous Reflexes
  The controller operates with permanent instinctual caution: physics overrules telemetry; multi-sensor agreement is required before critical maneuvers; and altitude is aggressively traded for control authority whenever airspeed decays.
