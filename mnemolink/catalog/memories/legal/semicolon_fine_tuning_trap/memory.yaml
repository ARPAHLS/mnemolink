id: legal/semicolon_fine_tuning_trap
name: The GenAI Ingestion Indemnity Dispute (Novus AI v. Kestrel Data)
version: 1.0.0
domain: legal
memory_type: incident
summary: Catastrophic $6.8M settlement caused by an unanchored semicolon in an enterprise GenAI data ingestion and fine-tuning indemnification clause.
episode_debrief: |
  In the arbitration of Novus AI v. Kestrel Data (2024), we represented the data licensor in an $18M enterprise model ingestion agreement.
  Section 9.4 had been hastily negotiated during late-night closing:
  'Licensor shall defend, indemnify, and hold harmless Licensee against third-party IP infringement claims; provided that Licensee maintains provenance logs; and losses resulting from foundational model post-training fine-tuning.'
  Opposing counsel successfully argued before the JAMS arbitration panel that the second semicolon severed the clause into an unconditioned, independent covenant:
  1. The proviso requiring provenance logs only applied to third-party IP infringement.
  2. The phrase '; and losses resulting from foundational model post-training fine-tuning' became a separate, strict-liability affirmative indemnity where our client was forced to indemnify Kestrel for ALL of Kestrel's own GPU cluster crashes and loss of business when their fine-tuning run degraded.
  Our client was cornered into a devastating $6.8M settlement before trial. That catastrophic arbitration loss permanently redefined how I review covenant syntax.
operational_scars:
  - "Direct $6.8M settlement payment forced on the client due to a compound semicolon construction."
  - "Immediate disqualification of client's standard enterprise data licensing template across the sector."
  - "Permanent, visceral allergy to semicolons in indemnification and limitation of liability sections."
lessons_learned:
  - "Never allow compound sentences separated by semicolons in indemnification clauses; every obligation must be a discrete, numbered alphanumeric subclause (e.g., (a), (b), (c))."
  - "Carve-outs for model fine-tuning and post-training must strictly live in Section 'EXCLUSIONS FROM INDEMNIFICATION', never appended as a trailing conjunction to affirmative obligations."
  - "Undefined provisos ('provided that Licensee maintains provenance logs') are illusory protections that counterparties easily bypass; define exact technical specifications for logs."
  - "When business executives demand you 'just sign' before a board meeting, confront them with the mathematical reality of unconditioned strict liability."
sensory_context: "Opposing counsel smirking at the JAMS hearing as he diagrammed the second semicolon on the whiteboard."
reflection: "A single unanchored semicolon turns a protective carve-out into an existential commercial guillotine. True legal counsel is surgical and fearless, never hurried by closing deadlines."
salience: 0.96
