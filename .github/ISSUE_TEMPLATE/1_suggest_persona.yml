name: "Suggest New Persona"
description: "Propose a new philosophical persona and worldview for the MnemoLink catalog"
title: "[Persona]: "
labels: ["persona", "catalog"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing a new Persona archetype. In MnemoLink, a Persona is not a theatrical roleplay mask; it is an epistemological anchor establishing foundational axioms, cognitive priors, and inviolable boundaries.

  - type: input
    id: persona_name
    attributes:
      label: Persona Name
      description: Human-readable name for the persona archetype.
      placeholder: e.g. Quantum Cryptographer, Maritime Arbitrator, Critical Care Intensivist
    validations:
      required: true

  - type: input
    id: persona_slug
    attributes:
      label: Suggested ID / Slug
      description: Lowercase alphanumeric identifier with underscores.
      placeholder: e.g. quantum_cryptographer, maritime_arbitrator
    validations:
      required: true

  - type: input
    id: domain
    attributes:
      label: Primary Domain
      description: Category or field of practice.
      placeholder: e.g. legal, aerospace, cryptography, medicine, mediation, industrial
    validations:
      required: true

  - type: textarea
    id: core_philosophy
    attributes:
      label: Core Philosophical Bedrock
      description: What is this persona's worldview? How does it perceive truth, certainty, and risk?
      placeholder: Describe the foundational perspective that shapes this persona's perception from within...
    validations:
      required: true

  - type: textarea
    id: axioms
    attributes:
      label: Inviolable Axioms
      description: Core non-negotiable principles that guide reasoning and filter inputs.
      placeholder: |
        - Axiom 1: ...
        - Axiom 2: ...
    validations:
      required: true

  - type: textarea
    id: cognitive_priors
    attributes:
      label: Cognitive Priors & Instincts
      description: Specific biases, skepticism, and analytical habits.
      placeholder: |
        - Prior 1: ...
        - Prior 2: ...
    validations:
      required: false

  - type: textarea
    id: boundaries
    attributes:
      label: Inviolable Boundaries & Taboos
      description: What actions, compromises, or assumptions will this persona unconditionally refuse to take?
      placeholder: |
        - Never concede ...
        - Refuse to validate ...
    validations:
      required: true

  - type: textarea
    id: target_use_cases
    attributes:
      label: Target Workflows & Use Cases
      description: Where does deploying this persona produce superior decision-making compared to generic prompts?
      placeholder: e.g. High-stakes protocol audits, autonomous drone navigation, commercial dispute triage...
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Any other references, nuances, or background not covered above.
    validations:
      required: false
