name: "Suggest New Lineage"
description: "Propose a dynamic lego-brick lineage chaining multiple memories into an evolutionary backstory"
title: "[Lineage]: "
labels: ["lineage", "catalog"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing a Lineage. In MnemoLink, a Lineage connects discrete memories chronologically, establishing causal bridges that explain how earlier scars shaped the mindset that navigated later crucibles.

  - type: input
    id: lineage_name
    attributes:
      label: Lineage Name
      description: Descriptive title for this evolutionary journey.
      placeholder: e.g. High-Stakes Legal Crucible, Extreme Weather Flight Scars
    validations:
      required: true

  - type: input
    id: lineage_slug
    attributes:
      label: Suggested ID / Slug
      description: Lowercase identifier with underscores.
      placeholder: e.g. legal_crucible, flight_scars
    validations:
      required: true

  - type: textarea
    id: memory_ids
    attributes:
      label: Included Memory IDs
      description: List of memory slugs in chronological order.
      placeholder: |
        - legal/clause_ambiguity_scar
        - legal/appellate_cross_examination
    validations:
      required: true

  - type: textarea
    id: causal_bridges
    attributes:
      label: Causal Connective Bridges
      description: How did surviving the earlier memory alter assumptions, perception, or caution in subsequent events?
      placeholder: Describe how memory A created the skepticism that prevented total collapse in memory B...
    validations:
      required: true

  - type: textarea
    id: cumulative_narrative
    attributes:
      label: Cumulative Backstory & Worldview
      description: The synthesized personal history resulting from this lineage.
      placeholder: What composite reflex does an agent equipped with this lineage possess?
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Any other background or notes.
    validations:
      required: false
