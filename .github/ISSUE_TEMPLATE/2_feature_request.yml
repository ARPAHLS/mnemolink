name: "Feature Proposal"
description: "Propose a new capability, adapter, architectural improvement, or core feature"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping shape the future of MnemoLink. Please describe the problem and your proposed architecture.

  - type: input
    id: feature_title
    attributes:
      label: Feature Title
      description: A concise summary of the proposed enhancement.
      placeholder: e.g. Dynamic Token Budget Optimization for Model Adapters
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Primary Component
      description: Where does this feature belong?
      options:
        - "Core Engine & Assembly"
        - "Lego Lineage Synthesizer"
        - "Universal Model Adapters"
        - "Hierarchical Discovery Engine"
        - "CLI & Developer Tooling"
        - "Benchmarking & Simulation Suite"
        - "Security, Linting & Verification"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: problem_statement
    attributes:
      label: Problem & Motivation
      description: What limitation or friction does this feature solve?
      placeholder: Describe the current bottleneck, limitation, or operational need...
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: How should this be implemented? Include code snippets, schemas, or design notes if applicable.
      placeholder: Describe the architectural approach or API changes...
    validations:
      required: true

  - type: textarea
    id: alternatives_considered
    attributes:
      label: Alternatives Considered
      description: Any alternative implementations or existing workarounds considered.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Any other background, references, or notes.
    validations:
      required: false
