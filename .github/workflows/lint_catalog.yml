name: Catalog Security & Integrity Gate

on:
  pull_request:
    paths:
      - "mnemolink/catalog/**"
      - "personas/**"
      - "memories/**"
      - "lineages/**"
      - "mnemolink/security.py"
  workflow_dispatch:

jobs:
  lint-mnemonic-catalog:
    name: Mnemonic Security & Delimiter Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Static Mnemonic Security Lint (--strict)
        run: |
          mnemolink lint --catalog --strict

      - name: Repository Standards & Integrity Gate
        run: |
          python scripts/verify_repo.py
