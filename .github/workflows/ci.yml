name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Code Formatting Check (Black)
        run: |
          black --check mnemolink tests examples scripts

      - name: Linting Check (Flake8)
        run: |
          flake8 mnemolink tests examples scripts

      - name: Repository Standards & Integrity Gate
        run: |
          python scripts/verify_repo.py

      - name: Run Test Suite (Pytest)
        run: |
          pytest tests/ -v

  build-check:
    name: Package Build Verification (sdist & wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Validate distribution artifacts
        run: |
          twine check dist/*
